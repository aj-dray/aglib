name: Publish

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out the repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      # npm's trusted publishing needs the npm CLI, not Bun's, and one recent
      # enough to speak OIDC to the registry.
      - name: Set up npm
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Upgrade npm for trusted publishing
        run: npm install -g npm@latest

      - name: Refuse a tag that does not name the manifest's version
        run: |
          version="$(bun -e 'console.log((await Bun.file("package.json").json()).version)')"
          test "v$version" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME, manifest $version"; exit 1; }

      - name: Install the locked dependencies
        run: bun install --frozen-lockfile

      - name: Run the gate
        run: bun run check

      - name: Publish
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ""
